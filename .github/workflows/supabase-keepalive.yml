name: Supabase keepalive

on:
    schedule:
        - cron: "0 9 * * *"
    workflow_dispatch:

jobs:
    ping-supabase:
        runs-on: ubuntu-latest
        env:
            SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
            SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

        steps:
            - name: Keep the Supabase project warm
              run: |
                  if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
                    echo "SUPABASE_URL/SUPABASE_KEY secrets are not set. Skipping keepalive."
                    exit 0
                  fi

                  # A lightweight REST ping counts as activity and prevents
                  # the free-tier project from being paused.
                  curl -fsS "${SUPABASE_URL}/rest/v1/" \
                    -H "apikey: ${SUPABASE_KEY}" \
                    -o /dev/null -w "Supabase REST ping: %{http_code}\n"
