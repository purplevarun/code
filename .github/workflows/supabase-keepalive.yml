name: Supabase keepalive

on:
    schedule:
        - cron: "0 9 * * *"
    workflow_dispatch:

jobs:
    ping-supabase:
        runs-on: ubuntu-latest
        env:
            SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
            SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

        steps:
            - name: Keep the Supabase project warm
              run: |
                  if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
                    echo "SUPABASE_URL/SUPABASE_KEY secrets are not set. Skipping keepalive."
                    exit 0
                  fi

                  # A lightweight API ping counts as activity and prevents
                  # the free-tier project from being paused. The bare /rest/v1/
                  # root requires a secret key on the newer API gateway, so the
                  # auth health endpoint is used instead (works with the
                  # publishable key).
                  curl -fsS "${SUPABASE_URL}/auth/v1/health" \
                    -H "apikey: ${SUPABASE_KEY}" \
                    -o /dev/null -w "Supabase auth ping: %{http_code}\n"
