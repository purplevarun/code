name: Supabase keepalive

on:
    schedule:
        - cron: "0 9,21 * * *"
    workflow_dispatch:

jobs:
    ping-supabase:
        runs-on: ubuntu-latest
        env:
            SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
            SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

        steps:
            - name: Keep the Supabase project warm
              run: |
                  if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
                    echo "SUPABASE_URL/SUPABASE_KEY secrets are not set. Skipping keepalive."
                    exit 0
                  fi

                  # Must hit the database: daily 200s from /auth/v1/health did not
                  # stop Supabase pausing the project (Nov 2026). Reads one row
                  # from purplecode.users, which anon can select.
                  curl -fsS "${SUPABASE_URL}/rest/v1/users?select=id&limit=1" \
                    -H "apikey: ${SUPABASE_KEY}" \
                    -H "Accept-Profile: purplecode" \
                    -o /dev/null -w "Supabase DB ping: %{http_code}\n"
